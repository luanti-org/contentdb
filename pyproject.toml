[project]
name = "contentdb"
authors = [
    {name = "Andrew Ward", email = "rw@rubenwardy.com"},
]
version = "1.25.1"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt(>=4.3.0,<5.0)",
    "beautifulsoup4>=4.15.0",
    "bleach>=6.4.0",
    "celery>=5.6.3",
    "deep-compare>=1.0.5",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-babel>=4.0.0",
    "flask-flatpages>=0.9.0",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "git-archive-all>=1.23.1",
    "gitdb>=4.0.12",
    "github-flask>=3.2.0",
    "gitpython>=3.2.1",
    "gunicorn>=26.2.0",
    "kombu>=5.6.2",
    "libsass>=0.23.0",
    "linkify-it-py>=2.2.0",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "passlib>=1.7.4",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.3",
    "redis>=7.4.1",
    "requests>=2.34.2",
    "sentry-sdk[flask]>=2.73.0",
    "sqlalchemy>=2.0.50,<2.1",
    "sqlalchemy-searchable>=3.0.0",
    "ua-parser>=1.0.2",
    "user-agents>=2.2.0",
    "validators>=0.36.0",
    "werkzeug>=3.1.9",
    "wtforms>=3.3.1",
    "wtforms-sqlalchemy>=0.4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "types-pyyaml",
    "types-requests",
    "types-bleach",
    "types-passlib",
    "types-redis",
    "types-wtforms>=3.2.1.20260518",
    "types-pygments>=2.21.0.20260819",
    "types-flask-migrate>=4.1.0.20260508",
    "types-libsass>=0.23.0.20260211",
]

[tool.mypy]
python_version = "3.14"
files = ["app"]
check_untyped_defs = true

# Libraries with no published stubs or py.typed marker
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "deep_compare.*",
    "flask_babel.*",
    "flask_flatpages.*",
    "flask_github.*",
    "flask_login.*",
    "flask_wtf.*",
    "git_archive_all.*",
    "gitdb.*",
    "kombu.*",
    "sqlalchemy_utils.*",
    "user_agents.*",
    "wtforms_sqlalchemy.*",
]
ignore_missing_imports = true
