{% from "macros/reviews.html" import render_reviews with context %}

<article class="my-5">
	{# Like the row widget: the link is beside the heading rather than floated above it #}
	<header class="heading-row">
		{% if title %}
			<h2>{{ title }}</h2>
		{% endif %}
		<a href="{{ url_for('packages.list_reviews') }}" class="btn btn-sm btn-secondary">
			{{ _("All reviews") }}
			<i class="fas fa-arrow-right ms-2" aria-hidden="true"></i>
		</a>
	</header>
	{{ render_reviews(reviews, current_user, True) }}
</article>
