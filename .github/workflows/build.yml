name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/luanti-org/contentdb
  CDB_TAG: ${{ github.sha }}

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
    - name: Install system dependencies
      run: sudo apt-get install -y libxml2-dev libxslt-dev libjpeg-dev
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Run mypy
      run: uv run mypy

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
    - name: Run ruff
      run: uv run --locked --only-group dev ruff check --output-format=github app utils

  build:
    runs-on: ubuntu-latest
    outputs:
      image-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
    - name: Build the Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        tags: ${{ env.IMAGE }}:${{ env.CDB_TAG }}
        outputs: type=docker,dest=${{ runner.temp }}/image.tar
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Hash the Docker image
      id: hash
      run: echo "sha256=$(sha256sum "$RUNNER_TEMP/image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: image
        path: ${{ runner.temp }}/image.tar
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Job env can't use the env context, so this repeats IMAGE and CDB_TAG
      CDB_TEST_IMAGE: ghcr.io/luanti-org/contentdb:${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: image
        path: ${{ runner.temp }}
    - name: Load the Docker image
      run: docker load -i ${{ runner.temp }}/image.tar
    - name: Create empty .env
      run: touch .env
    - name: Start test stack
      run: ./utils/test_stack.sh up
    - name: Run tests
      run: ./utils/tests_cov.sh
    - name: Stop test stack
      if: always()
      run: ./utils/test_stack.sh down

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: image
        path: ${{ runner.temp }}
    - name: Load the Docker image
      run: docker load -i ${{ runner.temp }}/image.tar
    - name: Copy config
      run: cp utils/ci/.env . && cp utils/ci/config.cfg .
    - name: Start Docker
      run: docker compose up -d
    - name: Run migrations
      run: ./utils/run_migrations.sh
    - name: Create test data
      run: docker compose exec -T app python utils/setup.py -t
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
    - name: Run Cypress
      uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
      with:
        browser: chrome
        wait-on: http://localhost:5123
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: cypress-screenshots
        path: cypress/screenshots
    - name: Stop Docker
      if: always()
      run: docker compose down

  publish:
    needs: [build, test, e2e, mypy, ruff]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'luanti-org/contentdb'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: image
        path: ${{ runner.temp }}
    - name: Verify the Docker image
      env:
        IMAGE_SHA256: ${{ needs.build.outputs.image-sha256 }}
      run: |
        test -n "$IMAGE_SHA256"
        echo "$IMAGE_SHA256  $RUNNER_TEMP/image.tar" | sha256sum -c -
    - name: Load the Docker image
      run: docker load -i ${{ runner.temp }}/image.tar
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push
      run: |
        docker push "$IMAGE:$CDB_TAG"

        # An older run can finish last, so only move latest if this is still the tip of master
        tip=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/master | cut -f1)
        if [ "$tip" != "$GITHUB_SHA" ]; then
          echo "::notice::Not tagging latest, master has moved on to $tip"
          exit 0
        fi

        docker tag "$IMAGE:$CDB_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
