name: contentdb

x-hardening: &hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: "postgres:14"
    restart: unless-stopped
    volumes:
      - "./data/db:/var/lib/postgresql/data"
    env_file:
      - .env

  redis:
    image: 'redis:6.2-alpine'
    restart: unless-stopped
    command: redis-server
    volumes:
      - './data/redis:/data'

  app:
    build: .
    restart: unless-stopped
    command: ./utils/entrypoint.sh
    <<: *hardening
    mem_limit: 3g
    pids_limit: 256
    env_file:
      - .env
    ports:
      - "127.0.0.1:5123:5123"
    tmpfs:
      - /tmp:size=1g
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
      - "$UPLOADS_DIR:/var/cdb/uploads"
      - "./data/logs:/var/cdb/logs"
      - "thumbnails:/var/cdb/thumbnails"
    depends_on:
      - db
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery worker --concurrency 1
    <<: *hardening
    # Limit includes the /tmp tmpfs.
    mem_limit: 3g
    pids_limit: 256
    # Per replica
    cpus: "1.5"
    cpu_shares: 512
    env_file:
      - .env
    tmpfs:
      - /tmp:size=2g
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
      - "$UPLOADS_DIR:/var/cdb/uploads"
    depends_on:
      - redis

  beat:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery beat --schedule /var/cdb/beat/celerybeat-schedule
    <<: *hardening
    mem_limit: 512m
    pids_limit: 64
    env_file:
      - .env
    tmpfs:
      - /tmp:size=64m
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
      - "beat:/var/cdb/beat"
    depends_on:
      - redis

  exporter:
    image: ovalmoney/celery-exporter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5125:9540"
    depends_on:
      - redis

volumes:
  thumbnails:
  beat:
