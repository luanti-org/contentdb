name: contentdb

services:
  db:
    image: "postgres:14"
    restart: unless-stopped
    volumes:
      - "./data/db:/var/lib/postgresql/data"
    env_file:
      - .env

  redis:
    image: 'redis:6.2-alpine'
    restart: unless-stopped
    command: redis-server
    volumes:
      - './data/redis:/data'

  app:
    build: .
    restart: unless-stopped
    command: ./utils/entrypoint.sh
    env_file:
      - .env
    ports:
      - "127.0.0.1:5123:5123"
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
      - "$UPLOADS_DIR:/var/cdb/uploads"
      - "./data/logs:/var/cdb/logs"
    depends_on:
      - db
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery worker --concurrency 1
    env_file:
      - .env
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
      - "$UPLOADS_DIR:/var/cdb/uploads"
    depends_on:
      - redis

  beat:
    build: .
    restart: unless-stopped
    command: celery -A app.tasks.celery beat
    env_file:
      - .env
    volumes:
      - "./config.cfg:/run/config/config.cfg:ro"
    depends_on:
      - redis

  exporter:
    image: ovalmoney/celery-exporter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5125:9540"
    depends_on:
      - redis
