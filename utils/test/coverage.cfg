# Coverage settings for utils/tests_cov.sh. This lives in utils/ rather than pyproject.toml because the test stack
# mounts utils/ from the working tree, but uses the pyproject.toml baked into the image.

[run]
source = app
omit =
	app/tests/*
	# Generated by utils/extract_translations.py
	app/_translations.py

[report]
# The minimum coverage of application code. Raise this as coverage improves, so it can't slip back.
fail_under = 60
